<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Antonblast</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { display: grid; place-items: center; font-family: Arial, Helvetica, sans-serif; }
    #canvas { display: block; width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; margin: 0; background: #000; image-rendering: pixelated; }
    #loading-layer { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; color: #fff; background: #000; text-align: center; pointer-events: none; }
    #loading-layer[hidden] { display: none; }
    #loading-spinner { width: 38px; height: 38px; border: 3px solid #303030; border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
    #loading-text { min-height: 20px; font-size: 15px; font-weight: 700; line-height: 1.35; }
    #loading-progress { width: min(76vw, 360px); height: 8px; margin: 0; border: 1px solid #444; border-radius: 999px; background: #161616; appearance: none; }
    #loading-progress::-webkit-progress-bar { border-radius: inherit; background: #161616; }
    #loading-progress::-webkit-progress-value { border-radius: inherit; background: #fff; }
    #loading-progress::-moz-progress-bar { border-radius: inherit; background: #fff; }
    #loading-detail { min-height: 18px; color: #aaa; font-size: 13px; font-variant-numeric: tabular-nums; }
    #runtime-support { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="canvas" class="emscripten" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

  <div id="loading-layer" role="status" aria-live="polite">
    <div id="loading-spinner" aria-hidden="true"></div>
    <div id="loading-text">Downloading game files</div>
    <progress id="loading-progress" value="0" max="100"></progress>
    <div id="loading-detail">0.00 MB / 29.64 MB</div>
  </div>

  <!-- Hidden compatibility nodes used by Antonblast's generated Emscripten runtime. -->
  <div id="runtime-support" aria-hidden="true">
    <div id="status">Downloading...</div>
    <progress id="progress" value="0" max="100"></progress>
    <div id="spinner"></div>
    <div id="output-container"><button id="QRButton"></button><button id="QR2Button"></button><button id="stats-button"></button><button id="share-button"></button><button id="log-state-button"></button><span id="multiplayer-stats"></span></div>
    <textarea id="output"></textarea>
    <div id="message-container"><div id="messages"></div></div>
    <div id="pauseMenuContainer" hidden><button id="resumeButton"></button><button id="quitButton"></button></div>
    <div id="QRCode"></div><div id="QR2Code"></div>
  </div>

  <script>
    (() => {
      'use strict';
      const loadingLayer = document.getElementById('loading-layer');
      const loadingText = document.getElementById('loading-text');
      const loadingProgress = document.getElementById('loading-progress');
      const loadingDetail = document.getElementById('loading-detail');
      const dataParts = ['runner.data.part1', 'runner.data.part2'];
      const totalBytes = 31084788;
      let loadedBytes = 0;

      const formatMB = bytes => (bytes / 1048576).toFixed(2);
      const updateProgress = (message, percent) => {
        loadingText.textContent = message;
        loadingProgress.value = Math.max(0, Math.min(100, percent));
        loadingDetail.textContent = `${formatMB(Math.min(loadedBytes, totalBytes))} MB / ${formatMB(totalBytes)} MB`;
      };

      async function fetchPart(url) {
        const response = await fetch(url, { cache: 'force-cache' });
        if (!response.ok || !response.body) throw new Error(`Unable to load ${url} (${response.status})`);
        const reader = response.body.getReader();
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          loadedBytes += value.byteLength;
          updateProgress('Downloading game files', loadedBytes / totalBytes * 100);
        }
        const bytes = new Uint8Array(chunks.reduce((total, chunk) => total + chunk.byteLength, 0));
        let offset = 0;
        for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.byteLength; }
        return bytes;
      }

      async function boot() {
        try {
          const buffers = [];
          for (const part of dataParts) buffers.push(await fetchPart(part));
          const runnerDataUrl = URL.createObjectURL(new Blob(buffers, { type: 'application/octet-stream' }));
          const originalFetch = window.fetch;
          window.fetch = function(input, init) {
            const url = input instanceof Request ? input.url : String(input);
            if (url.includes('runner.data')) input = input instanceof Request ? new Request(runnerDataUrl, input) : runnerDataUrl;
            return originalFetch(input, init);
          };
          const originalOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function(method, url, ...rest) {
            if (String(url).includes('runner.data')) url = runnerDataUrl;
            return originalOpen.call(this, method, url, ...rest);
          };
          updateProgress('Starting game', 100);
          const indexScript = document.createElement('script');
          indexScript.src = 'index.js';
          indexScript.onload = () => {
            const runnerScript = document.createElement('script');
            runnerScript.src = 'runner.js';
            runnerScript.onload = () => {
              const checkReady = () => {
                if ((window.Module && window.Module.calledRun) || document.getElementById('canvas').classList.contains('active')) {
                  loadingLayer.hidden = true;
                  return;
                }
                window.setTimeout(checkReady, 200);
              };
              checkReady();
            };
            runnerScript.onerror = () => { loadingText.textContent = 'Unable to start game'; };
            document.body.appendChild(runnerScript);
          };
          indexScript.onerror = () => { loadingText.textContent = 'Unable to load game runtime'; };
          document.body.appendChild(indexScript);
        } catch (error) {
          loadingText.textContent = 'Loading failed';
          loadingDetail.textContent = error && error.message ? error.message : String(error);
        }
      }
      boot();
    })();
  </script>
</body>
</html>
