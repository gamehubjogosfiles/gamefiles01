<!DOCTYPE html>
<html>
<head>
    
<!-- Fullscreen is controlled by the GameHub player. -->


        
<!-- Fullscreen is controlled by the GameHub player. -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, minimal-ui">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Balatro</title>
    
    <script>
        const PREFIX = "Balatro_Balatro_";
        const originalOpen = indexedDB.open;
        const originalDeleteDatabase = indexedDB.deleteDatabase;
        indexedDB.open = function(name, version) {
            const prefixedName = PREFIX + name;
            return version !== undefined ? originalOpen.call(this, prefixedName, version) : originalOpen.call(this, prefixedName);
        };
        indexedDB.deleteDatabase = function(name) {
            const prefixedName = PREFIX + name;
            return originalDeleteDatabase.call(this, prefixedName);
        };
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; }
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 9999;
        }
        .loading-text { font-size: 24px; margin-bottom: 10px; }
        .loading-progress { font-size: 18px; color: #aaa; }
        #orientation {
            margin: 0 auto;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url(rotate.png);
            background-repeat: no-repeat;
            background-position: center;
            background-color: rgb(0, 0, 0);
            background-size: 25%;
            z-index: 99999;
            display: none;
        }
        @media screen and (orientation: portrait) {
            #orientation {
                display: block;
            }
        }
        #fullscreen-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 6px;
            cursor: pointer;
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, border-color 0.2s;
        }
        @media (hover: none) and (pointer: coarse) {
            #fullscreen-btn {
                display: flex;
            }
        }
        #fullscreen-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }
        #fullscreen-btn svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }
        .emscripten_border { border: none !important; }
        div[style*="background: red;"] { display: none !important; }
        div[style*="background-color: red;"] { display: none !important; }
    </style>
</head>
<body>
    <div id="orientation"></div>
    <div id="loading-screen">
        <div class="loading-text">Loading Balatro...</div>
        <div id="progress-text" class="loading-progress">0.00 MB / 113.25 MB</div>
    </div>
    <button id="fullscreen-btn" title="Toggle Fullscreen">
        <svg viewBox="0 0 24 24">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
    </button>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    
    <script src="love.min.js"></script>
    
<!-- Fullscreen is controlled by the GameHub player. -->

</body>
</html>
