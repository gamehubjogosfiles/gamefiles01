<head>
    
<!-- Fullscreen is controlled by the GameHub player. -->

    <link rel="icon" type="image/x-icon" href="favicon.ico">



<style id="gamehub-touch-style">
  html, body, canvas, img, a, button, input, select, textarea, div {
    -webkit-tap-highlight-color: transparent !important;
    -webkit-touch-callout: none !important;
    -webkit-user-select: none !important;
    user-select: none !important;
  }
  *, *::before, *::after { -webkit-tap-highlight-color: transparent !important; }
  ::selection { background: transparent !important; color: inherit !important; }
  :focus, :focus-visible, canvas:active, canvas:focus { outline: none !important; box-shadow: none !important; }
</style>
</head>
<!-- Ported by Martin_MMC -->
<script>
    launch();

    function launch() {
        try {
            fetch("https://cdn.jsdelivr.net/gh/martinmmcyt/rocket-goal@main/game.html?t=" + Date.now())
                .then(response => response.text())
                .then(html => {
                    document.documentElement.innerHTML = html;

                    const link = document.createElement('link');
                    link.rel = 'icon';
                    link.type = 'image/x-icon';
                    link.href = 'favicon.ico';
                    document.head.appendChild(link);
                    document.title = 'Rocket Goal';
        

                    document.documentElement.querySelectorAll('script').forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        document.body.appendChild(newScript);
                    });
                });
        } catch (error) {
            console.error('error:', error);
        }
    }
</script>
