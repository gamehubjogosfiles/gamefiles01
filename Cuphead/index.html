<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover, user-scalable=no, shrink-to-fit=yes">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Play Cuphead online on GameHub.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="TemplateData/style.css">
  <title>Cuphead</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #unity-container { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
    #unity-canvas { width: 100vw; height: 100vh; display: block; background: #000; }
    #orientation { display: none; position: fixed; inset: 0; z-index: 100000; place-items: center; padding: 24px; background: #000; color: #fff; font: 800 clamp(22px, 8vw, 42px)/1.1 Arial, sans-serif; letter-spacing: .04em; text-align: center; }
  </style>
  <style id="gamehub-touch-style">
    html, body, body * { -webkit-tap-highlight-color: rgba(0,0,0,0) !important; }
    html, body, canvas { -webkit-touch-callout: none !important; touch-action: manipulation; }
    html, body, canvas, img, a, button, iframe, [role="button"] { -webkit-user-select: none !important; user-select: none !important; }
    *, *::before, *::after { outline: 0 !important; -webkit-focus-ring-color: transparent !important; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1" aria-label="Cuphead"></canvas>
    <div id="unity-loading-bar" role="status" aria-live="polite">
      <div id="unity-logo" aria-hidden="true"></div>
      <div id="unity-progress-bar-empty" role="progressbar" aria-label="Loading Cuphead" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning" role="alert"></div>
  </div>
  <div id="orientation">Rotate your device</div>

  <script src="Build/Cuphead.loader.js"></script>
  <script>
  (() => {
    'use strict';
    const canvas = document.querySelector('#unity-canvas');
    const loadingBar = document.querySelector('#unity-loading-bar');
    const progressBar = document.querySelector('#unity-progress-bar-empty');
    const progressBarFull = document.querySelector('#unity-progress-bar-full');
    const errorBox = document.querySelector('#unity-warning');
    const orientation = document.querySelector('#orientation');
    const PART_COUNT = 26;
    const TOTAL_BYTES = 1294.63 * 1024 * 1024;
    let loadedBytes = 0;
    loadingBar.style.display = 'block';

    const notifyParent = (state, message) => {
      if (window.parent !== window) window.parent.postMessage({ gamehub: 'game-status', state, message: message || '' }, '*');
    };
    const updateProgress = (message, bytes = loadedBytes, percent = Math.min(96, bytes / TOTAL_BYTES * 96)) => {
      const safePercent = Math.max(0, Math.min(100, percent));
      progressBarFull.style.width = `${safePercent}%`;
      progressBar.setAttribute('aria-valuenow', String(Math.round(safePercent)));
      progressBar.setAttribute('aria-label', message);
    };
    const showError = message => {
      errorBox.textContent = message || 'Could not start Cuphead. Refresh the page to try again.';
      errorBox.style.display = 'block';
      notifyParent('error', message || 'Could not start Cuphead');
    };

    async function loadMultipartData() {
      const parts = [];
      for (let index = 1; index <= PART_COUNT; index += 1) {
        const filename = `Build/Cuphead.data.${String(index).padStart(3, '0')}`;
        const response = await fetch(filename, { cache: 'force-cache' });
        if (!response.ok) throw new Error(`Missing ${filename}`);
        if (!response.body) throw new Error(`Could not stream ${filename}`);
        const reader = response.body.getReader();
        const chunks = [];
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          chunks.push(value);
          loadedBytes += value.byteLength;
          updateProgress('Downloading game files');
        }
        parts.push(new Uint8Array(chunks.reduce((total, chunk) => total + chunk.byteLength, 0)));
        let offset = 0;
        for (const chunk of chunks) {
          parts[parts.length - 1].set(chunk, offset);
          offset += chunk.byteLength;
        }
        updateProgress('Downloading game files');
      }
      return URL.createObjectURL(new Blob(parts, { type: 'application/octet-stream' }));
    }

    function updateOrientation() {
      const needsLandscape = window.matchMedia('(max-width: 900px) and (orientation: portrait)').matches;
      orientation.style.display = needsLandscape ? 'grid' : 'none';
    }
    window.addEventListener('resize', updateOrientation, { passive: true });
    window.addEventListener('orientationchange', updateOrientation, { passive: true });
    updateOrientation();

    (async () => {
      try {
        notifyParent('loading', 'Downloading game files');
        const dataUrl = await loadMultipartData();
        updateProgress('Starting game', TOTAL_BYTES, 96);
        const config = {
          dataUrl,
          frameworkUrl: 'Build/Cuphead.framework.js',
          codeUrl: 'Build/Cuphead.wasm',
          streamingAssetsUrl: 'StreamingAssets',
          companyName: 'Studio MDHR',
          productName: 'Cuphead',
          productVersion: '1.0',
          unityFileSystemInit: () => {}
        };
        await createUnityInstance(canvas, config, progress => {
          const percent = 96 + Math.max(0, Math.min(1, progress)) * 4;
          updateProgress(progress >= 1 ? 'Starting game' : 'Loading game engine', TOTAL_BYTES, percent);
        });
        updateProgress('Ready', TOTAL_BYTES, 100);
        notifyParent('ready');
        setTimeout(() => { loadingBar.style.display = 'none'; }, 250);
      } catch (error) {
        showError(error && error.message ? error.message : 'The game files could not be loaded.');
      }
    })();
  })();
  </script>
  <script id="gamehub-touch-behavior">
  (() => {
    const clearTransientTouchState = () => {
      if (window.getSelection) window.getSelection().removeAllRanges();
      const active = document.activeElement;
      if (active && active !== document.body && !/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) active.blur();
    };
    document.addEventListener('pointerup', clearTransientTouchState, { capture: true, passive: true });
    document.addEventListener('touchend', clearTransientTouchState, { capture: true, passive: true });
  })();
  </script>
</body>
</html>
